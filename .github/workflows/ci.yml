# ============================================================
# Proximo — Intégration continue
# Vérifie : lint, tests unitaires, builds (backend + frontend),
# puis build des images Docker.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pinner npm (bug "Exit handler never called!" de npm 10.9.x)
        run: npm install -g npm@10.8.2

      - name: Installer les dépendances
        # Résilience : IPv4 forcé + retries renforcés + nouvelle tentative.
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=60000 \
            || { sleep 10; npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=60000; }

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pinner npm (bug "Exit handler never called!" de npm 10.9.x)
        run: npm install -g npm@10.8.2

      - name: Installer les dépendances
        # Résilience : IPv4 forcé + retries renforcés + nouvelle tentative.
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=60000 \
            || { sleep 10; npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=60000; }

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Build des images Docker
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valider docker-compose.yml
        run: docker compose config --quiet

      - name: Build des images
        run: docker compose build
