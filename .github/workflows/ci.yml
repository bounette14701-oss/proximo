# ============================================================
# Proximo — Intégration continue
# Vérifie : lint, tests unitaires, builds (backend + frontend),
# puis build + publication des images Docker sur GHCR
# (ghcr.io/bounette14701-oss/proximo-{backend,frontend}).
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Lecture du dépôt + écriture des paquets GHCR (images Docker).
permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pinner npm (bug "Exit handler never called!" de npm 10.9.x)
        run: npm install -g npm@10.8.2

      - name: Installer les dépendances
        # Résilience : on utilise le cache npm restauré par setup-node
        # (~/.npm) avec --prefer-offline — PAS de --cache /tmp/npm-cache
        # (vide à chaque run → re-téléchargement massif → bug npm
        # "Exit handler never called!" sur les runners). 3 tentatives.
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          for i in 1 2 3; do
            echo "--- tentative npm ci $i/3 ---"
            if npm ci --no-audit --no-fund --prefer-offline \
              --fetch-retries=5 \
              --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=60000; then
              echo "npm ci OK (tentative $i)"
              break
            fi
            [ "$i" = 3 ] && { echo "npm ci a échoué 3 fois"; exit 1; }
            sleep 15
          done

      - name: Générer le client Prisma
        # Version épinglée : si npm ci a échoué partiellement, npx ne doit
        # jamais installer prisma@latest (7.x rejette le schéma v5).
        run: npx prisma@5.22.0 generate

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pinner npm (bug "Exit handler never called!" de npm 10.9.x)
        run: npm install -g npm@10.8.2

      - name: Installer les dépendances
        # Résilience : cache npm restauré par setup-node + --prefer-offline
        # (pas de --cache /tmp/npm-cache vide → bug "Exit handler never
        # called!" sur les runners). 3 tentatives.
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          for i in 1 2 3; do
            echo "--- tentative npm ci $i/3 ---"
            if npm ci --no-audit --no-fund --prefer-offline \
              --fetch-retries=5 \
              --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=60000; then
              echo "npm ci OK (tentative $i)"
              break
            fi
            [ "$i" = 3 ] && { echo "npm ci a échoué 3 fois"; exit 1; }
            sleep 15
          done

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Build et publication des images Docker (GHCR)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Publication uniquement sur main (pas sur les PR).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Valider docker-compose.yml
        run: docker compose config --quiet

      - name: Se connecter au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (tags GHCR)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Métadonnées frontend (tags GHCR)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build et push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Build et push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
