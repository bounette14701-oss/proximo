# ============================================================
# Proximo — Reverse proxy Nginx
# /        -> frontend Next.js (port 3000)
# /api     -> backend NestJS (port 3001)
# ============================================================

server {
    listen 80;
    server_name _;

    # Sécurité des en-têtes
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # Limites de corps de requête (JSON ~1 Mo ; uploads signalements jusqu'à
    # 5 fichiers de 5 Mo → 30 Mo pour être confortable)
    client_max_body_size 30m;

    # Frontend (Next.js)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API (NestJS) — le préfixe /api est conservé tel quel
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
